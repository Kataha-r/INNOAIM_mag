<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10170f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="InnoAim Klient" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>InnoAim — panel klienta</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="innoaim-phone-icon-512.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="innoaim-phone-icon-512.jpg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="client-body">
    <main class="client-shell">
      <section class="client-hero">
        <img src="innoaim-logo.png" alt="InnoAim" />
        <div>
          <span>Panel klienta</span>
          <h1>Dostępne produkty InnoAim</h1>
          <p>Po zalogowaniu zobaczysz tylko produkty przypisane do Twojego adresu e-mail.</p>
        </div>
      </section>

      <section class="client-login-card card" id="clientLoginCard">
        <span class="section-label">Bezpieczny dostęp</span>
        <h2>Zaloguj się e-mailem</h2>
        <p>Wyślemy link logowania. Bez logowania produkty nie są widoczne.</p>
        <form id="clientLoginForm">
          <label>Adres e-mail klienta<input name="email" type="email" placeholder="klient@firma.pl" required /></label>
          <button type="submit" class="primary-button">Wyślij link logowania</button>
        </form>
      </section>

      <section class="client-products-card card" id="clientProductsCard" hidden>
        <div class="client-products-heading">
          <div>
            <span class="section-label">Produkty</span>
            <h2>Produkty przypisane do klienta</h2>
            <p id="clientStatus">Ładowanie produktów…</p>
          </div>
          <div class="client-actions">
            <label class="client-search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 1-4.7 13.3L2 20.1 3.9 22l3.8-3.8A7.5 7.5 0 0 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
              <input id="clientSearch" type="search" placeholder="Szukaj produktu…" />
            </label>
            <button type="button" class="data-button" id="clientRefreshButton">Odśwież</button>
            <button type="button" class="login-button logged-in" id="clientLogoutButton">Wyloguj</button>
          </div>
        </div>
        <div class="client-products-list" id="clientProductsList"></div>
      </section>
    </main>

    <div class="toast" id="clientToast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="client.js"></script>
  </body>
</html>
